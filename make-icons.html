<!DOCTYPE html>
<html><body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(id, size) {
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  const s = size;
  // Fondo verde oscuro
  const grad = ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grad.addColorStop(0, '#064e3b');
  grad.addColorStop(1, '#0c0207');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0,0,s,s,s*0.2);
  ctx.fill();
  // Emoji
  ctx.font = `${s*0.65}px "Segoe UI Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦕', s/2, s/2);
  // Descargar
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = id.replace('c','icon-') + '.png';
  a.click();
}
setTimeout(() => { drawIcon('c192',192); }, 300);
setTimeout(() => { drawIcon('c512',512); }, 800);
</script>
</body></html>
